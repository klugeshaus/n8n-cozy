ended; needs Sysbox on the node) or privileged (needed on immutable-rootfs distributions such as Talos).","type":"string","default":"sysbox","enum":["sysbox","privileged"]},"acknowledgePrivileged":{"description":"Required to render isolation: privileged; confirms the namespace admits privileged pods.","type":"boolean","default":false},"image":{"description":"Runner (docker-in-docker) image.","type":"object","default":{},"properties":{"repository":{"description":"Image repository.","type":"string","default":"n8nio/n8n-sandbox-service-runner-dind"},"tag":{"description":"Image tag.","type":"string","default":"1.16.0"}}},"sandboxImage":{"description":"Image each sandbox container runs from.","type":"object","default":{},"properties":{"repository":{"description":"Image repository.","type":"string","default":"n8nio/n8n-sandbox-service-sandbox"},"tag":{"description":"Image tag.","type":"string","default":"1.16.0"}}},"replicas":{"description":"Number of runner replicas.","type":"integer","default":1,"minimum":1},"capacityTotal":{"description":"Maximum concurrent sandboxes per runner. Mandatory; size it for your node pool.","type":"string","default":"100","pattern":"^[0-9]+$"},"dataRootSizeLimit":{"description":"Size limit of the runner scratch emptyDir.","pattern":"^(\\+|-)?(([0-9]+(\\.[0-9]*)?)|(\\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\\+|-)?(([0-9]+(\\.[0-9]*)?)|(\\.[0-9]+))))?$","anyOf":[{"type":"integer"},{"type":"string"}],"x-kubernetes-int-or-string":true},"nodeSelector":{"description":"Node selector for the runner pods (defaults to sysbox-install: yes).","type":"object","default":{"sysbox-install":"yes"}},"tolerations":{"description":"Tolerations for the Sysbox taint (defaults to the upstream sysbox-runtime=not-running toleration).","type":"array","default":[{"key":"sysbox-runtime","operator":"Equal","value":"not-running","effect":"NoSchedule"}]},"resourcesPreset":{"description":"Sizing preset for each runner replica.","type":"string","default":"t1.medium","enum":["t1.nano","t1.micro","t1.small","t1.medium","t1.large","t1.xlarge","t1.2xlarge","t1.4xlarge","c1.nano","c1.micro","c1.small","c1.medium","c1.large","c1.xlarge","c1.2xlarge","c1.4xlarge","s1.nano","s1.micro","s1.small","s1.medium","s1.large","s1.xlarge","s1.2xlarge","s1.4xlarge","u1.nano","u1.micro","u1.small","u1.medium","u1.large","u1.xlarge","u1.2xlarge","u1.4xlarge","m1.nano","m1.micro","m1.small","m1.medium","m1.large","m1.xlarge","m1.2xlarge","m1.4xlarge","nano","micro","small","medium","large","xlarge","2xlarge"]},"resources":{"description":"Explicit CPU/memory overrides.","type":"object","default":{},"properties":{"cpu":{"description":"CPU available to each runner replica.","pattern":"^(\\\\+|-)?(([0-9]+(\\\\.[0-9]*)?)|(\\\\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\\\\+|-)?(([0-9]+(\\\\.[0-9]*)?)|(\\\\.[0-9]+))))?$","anyOf":[{"type":"integer"},{"type":"string"}],"x-kubernetes-int-or-string":true},"memory":{"description":"Memory (RAM) available to each runner replica.","pattern":"^(\\\\+|-)?(([0-9]+(\\\\.[0-9]*)?)|(\\\\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\\\\+|-)?(([0-9]+(\\\\.[0-9]*)?)|(\\\\.[0-9]+))))?$","anyOf":[{"type":"integer"},{"type":"string"}],"x-kubernetes-int-or-string":true}}}}}}},"search":{"description":"Search: optional in-cluster SearXNG metasearch engine with the JSON API enabled. Disabled by default.","type":"object","default":{},"properties":{"enabled":{"description":"Deploy SearXNG and expose it to n8n at http://<release>-search:8080.","type":"boolean","default":false},"image":{"description":"SearXNG image.","type":"object","default":{},"properties":{"repository":{"description":"Image repository.","type":"string","default":"searxng/searxng"},"tag":{"description":"Image tag.","type":"string","default":"2026.11.15-2d500cb6b"}}},"resourcesPreset":{"description":"Sizing preset for the SearXNG container.","type":"string","default":"t1.nano","enum":["t1.nano","t1.micro","t1.small","t1.medium","t1.large","t1.xlarge","t1.2xlarge","t1.4xlarge","c1