suite: n8n with Code Sandbox and Search enabled
release:
  name: n8n-test
  namespace: tenant-test
set:
  sandbox.enabled: true
  search.enabled: true
tests:
  - it: renders the task runner Deployment alongside n8n
    template: templates/sandbox.yaml
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - isKind:
          of: Deployment
      - equal:
          path: metadata.name
          value: n8n-test-runner

  - it: renders the task broker Service alongside n8n
    template: templates/sandbox.yaml
    documentSelector:
      path: kind
      value: Service
    asserts:
      - isKind:
          of: Service
      - equal:
          path: metadata.name
          value: n8n-test-broker

  - it: renders the SearXNG Deployment
    template: templates/search.yaml
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - isKind:
          of: Deployment
      - equal:
          path: metadata.name
          value: n8n-test-search

  - it: renders the SearXNG Service
    template: templates/search.yaml
    documentSelector:
      path: kind
      value: Service
    asserts:
      - isKind:
          of: Service
      - equal:
          path: metadata.name
          value: n8n-test-search

  - it: configures the main Deployment for both external runners and SearXNG
    template: templates/deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: N8N_RUNNERS_MODE
            value: external
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: N8N_NATIVE_PYTHON_RUNNER
            value: "true"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SEARXNG_URL
            value: http://n8n-test-search:8080
      - equal:
          path: spec.replicas
          value: 1
