suite: n8n Code Sandbox enabled
release:
  name: n8n-test
  namespace: tenant-test
set:
  sandbox.enabled: true
tests:
  - it: renders the self-signed CA Secret
    template: templates/sandbox.yaml
    documentIndex: 0
    asserts:
      - isKind:
          of: Secret
      - equal:
          path: metadata.name
          value: n8n-test-sandbox-ca
      - isNotEmpty:
          path: data["tls.crt"]
      - isNotEmpty:
          path: data["tls.key"]

  - it: renders the four mTLS leaf Secrets with cert, key and CA
    template: templates/sandbox.yaml
    documentSelector:
      path: kind
      value: Secret
    asserts:
      - isNotEmpty:
          path: data["tls.crt"]
      - isNotEmpty:
          path: data["tls.key"]
      - isNotEmpty:
          path: data["ca.crt"]

  - it: renders the sandbox auth Secret
    template: templates/sandbox.yaml
    documentIndex: 5
    asserts:
      - isKind:
          of: Secret
      - equal:
          path: metadata.name
          value: n8n-test-sandbox-auth
      - isNotEmpty:
          path: data["api-keys"]

  - it: renders the sandbox API ConfigMap
    template: templates/sandbox.yaml
    documentIndex: 6
    asserts:
      - isKind:
          of: ConfigMap
      - equal:
          path: metadata.name
          value: n8n-test-sandbox-config

  - it: renders the sandbox API Deployment with the pinned image
    template: templates/sandbox.yaml
    documentIndex: 10
    asserts:
      - isKind:
          of: Deployment
      - equal:
          path: metadata.name
          value: n8n-test-sandbox
      - equal:
          path: spec.replicas
          value: 1
      - equal:
          path: spec.template.spec.containers[0].image
          value: n8nio/n8n-sandbox-service-api:1.16.0

  - it: renders the sandbox API Service
    template: templates/sandbox.yaml
    documentIndex: 8
    asserts:
      - isKind:
          of: Service
      - equal:
          path: metadata.name
          value: n8n-test-sandbox

  - it: renders the runner StatefulSet
    template: templates/sandbox.yaml
    documentIndex: 11
    asserts:
      - isKind:
          of: StatefulSet
      - equal:
          path: metadata.name
          value: n8n-test-sandbox-runner
      - equal:
          path: spec.template.spec.runtimeClassName
          value: sysbox-runc

  - it: wires n8n to the sandbox API with all four variables
    template: templates/deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: N8N_INSTANCE_AI_SANDBOX_ENABLED
            value: "true"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: N8N_INSTANCE_AI_SANDBOX_PROVIDER
            value: n8n-sandbox
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: N8N_SANDBOX_SERVICE_URL
            value: http://n8n-test-sandbox:8080
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: N8N_SANDBOX_SERVICE_API_KEY

  - it: keeps the shared sandbox API key in the credentials Secret
    template: templates/secret.yaml
    asserts:
      - isNotEmpty:
          path: data.SANDBOX_API_KEY
