suite: n8n Code Sandbox enabled
release:
  name: n8n-test
  namespace: tenant-test
set:
  sandbox.enabled: true
tests:
  - it: renders the task runner Deployment named <release>-runner
    template: templates/sandbox.yaml
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - isKind:
          of: Deployment
      - equal:
          path: metadata.name
          value: n8n-test-runner
      - equal:
          path: spec.replicas
          value: 1
      - equal:
          path: spec.template.spec.containers[0].image
          value: n8nio/runners:2.48.5

  - it: renders the task broker Service named <release>-broker
    template: templates/sandbox.yaml
    documentSelector:
      path: kind
      value: Service
    asserts:
      - isKind:
          of: Service
      - equal:
          path: metadata.name
          value: n8n-test-broker

  - it: wires the n8n task broker in external runners mode
    template: templates/deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: N8N_RUNNERS_MODE
            value: external
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: N8N_RUNNERS_BROKER_LISTEN_ADDRESS
            value: 0.0.0.0
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: N8N_NATIVE_PYTHON_RUNNER
            value: "true"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: N8N_RUNNERS_AUTH_TOKEN
