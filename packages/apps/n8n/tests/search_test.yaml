suite: n8n Search enabled
release:
  name: n8n-test
  namespace: tenant-test
set:
  search.enabled: true
tests:
  - it: renders the SearXNG Deployment named <release>-search
    template: templates/search.yaml
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - isKind:
          of: Deployment
      - equal:
          path: metadata.name
          value: n8n-test-search

  - it: renders the SearXNG Service named <release>-search
    template: templates/search.yaml
    documentSelector:
      path: kind
      value: Service
    asserts:
      - isKind:
          of: Service
      - equal:
          path: metadata.name
          value: n8n-test-search

  - it: renders a SearXNG settings document with the JSON format enabled
    template: templates/search.yaml
    asserts:
      # settings.yml is embedded in a Secret or ConfigMap; assert on the raw
      # manifest so the test does not depend on which resource kind is used.
      - matchRaw: (?s)settings\.yml.*formats.*json

  - it: points n8n at the in-cluster SearXNG instance
    template: templates/deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SEARXNG_URL
            value: http://n8n-test-search:8080
