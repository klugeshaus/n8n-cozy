{{- $host := include "n8n.host" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels:
    {{- include "n8n.labels" . | nindent 4 }}
spec:
  # SQLite on an RWO volume: never run two writers against the same database.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "n8n.mainSelectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "n8n.mainSelectorLabels" . | nindent 8 }}
        workloads.cozystack.io/resource-preset: {{ .Values.resourcesPreset | quote }}
    spec:
      securityContext:
        fsGroup: 1000
      containers:
        - name: n8n
          image: {{ printf "%s:%s" .Values.image.repository .Values.image.tag | quote }}
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 5678
              protocol: TCP
          env:
            - name: N8N_HOST
              value: {{ $host | quote }}
            - name: N8N_PORT
              value: "5678"
            - name: N8N_PROTOCOL
              value: "https"
            - name: WEBHOOK_URL
              value: {{ printf "https://%s/" $host | quote }}
            - name: N8N_EDITOR_BASE_URL
              value: {{ printf "https://%s/" $host | quote }}
            - name: N8N_PROXY_HOPS
              value: "1"
            - name: N8N_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-credentials
                  key: N8N_ENCRYPTION_KEY
            - name: DB_TYPE
              value: "sqlite"
            - name: GENERIC_TIMEZONE
              value: {{ .Values.timezone | quote }}
            - name: TZ
              value: {{ .Values.timezone | quote }}
            - name: N8N_DIAGNOSTICS_ENABLED
              value: "false"
            - name: N8N_VERSION_NOTIFICATIONS_ENABLED
              value: "false"
            - name: N8N_COMMUNITY_PACKAGES_ENABLED
              value: "true"
            {{- if .Values.communityPackages }}
            - name: N8N_COMMUNITY_PACKAGES_MANAGED_BY_ENV
              value: "true"
            - name: N8N_COMMUNITY_PACKAGES
              value: {{ .Values.communityPackages | quote }}
            {{- end }}
            {{- if .Values.search.enabled }}
            # Convenience hint for workflows; the built-in HTTP Request node
            # can call SearXNG's JSON API at this in-cluster URL.
            - name: SEARXNG_URL
              value: {{ printf "http://%s-search:8080" .Release.Name | quote }}
            {{- end }}
            {{- if .Values.sandbox.enabled }}
            # Code Sandbox: point n8n at the sandbox service API. The shared
            # admin API key is read from the <release>-credentials Secret,
            # where the sandbox API reads it from as well (single source of
            # truth; see secret.yaml and sandbox.yaml).
            - name: N8N_INSTANCE_AI_SANDBOX_ENABLED
              value: "true"
            - name: N8N_INSTANCE_AI_SANDBOX_PROVIDER
              value: "n8n-sandbox"
            - name: N8N_SANDBOX_SERVICE_URL
              value: {{ if .Values.sandbox.external.enabled }}{{ .Values.sandbox.external.url | quote }}{{ else }}{{ printf "http://%s-sandbox:8080" .Release.Name | quote }}{{ end }}
            - name: N8N_SANDBOX_SERVICE_API_KEY
              {{- if .Values.sandbox.external.enabled }}
              value: {{ .Values.sandbox.external.apiKey | quote }}
              {{- else }}
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-credentials
                  key: SANDBOX_API_KEY
              {{- end }}
            {{- end }}
          volumeMounts:
            - name: data
              mountPath: /home/node/.n8n
          resources:
            {{- include "n8n.resources" (dict "preset" .Values.resourcesPreset "explicit" .Values.resources) | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-data
