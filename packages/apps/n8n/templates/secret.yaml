{{/*
  Stable credentials for the n8n instance.

  N8N_ENCRYPTION_KEY encrypts stored credentials in the SQLite database. It
  MUST NOT change across upgrades, otherwise existing credentials become
  undecryptable. SANDBOX_API_KEY is the admin key the Code Sandbox shares:
  n8n (N8N_SANDBOX_SERVICE_API_KEY) and the sandbox API (SANDBOX_API_KEYS)
  both read it from this Secret, so the two can never drift. Both values are
  generated once and then preserved from the live Secret via lookup (same
  pattern as the official n8n Helm chart). An explicit
  .Values.sandbox.apiKey overrides the generated value.
*/}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace (printf "%s-credentials" .Release.Name) }}
{{- $enc := "" }}
{{- $sandboxKey := "" }}
{{- if and $existing $existing.data }}
{{- $enc = index $existing.data "N8N_ENCRYPTION_KEY" | default "" }}
{{- $sandboxKey = index $existing.data "SANDBOX_API_KEY" | default "" }}
{{- end }}
{{- if .Values.sandbox.apiKey }}
{{- $sandboxKey = .Values.sandbox.apiKey | b64enc }}
{{- end }}
{{- if not $enc }}
{{- $enc = randAlphaNum 32 | b64enc }}
{{- end }}
{{- if not $sandboxKey }}
{{- $sandboxKey = randAlphaNum 32 | b64enc }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-credentials
  labels:
    {{- include "n8n.labels" . | nindent 4 }}
type: Opaque
data:
  N8N_ENCRYPTION_KEY: {{ $enc | quote }}
  SANDBOX_API_KEY: {{ $sandboxKey | quote }}
