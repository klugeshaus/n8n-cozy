{{/*
  Ingress for the tenant. Cozystack 1.7.1 exposes either a shared Gateway API
  Gateway (tenant namespace's _namespace.gateway) or a plain ingress class.
  _namespace is injected by the cozystack-values Secret on a live cluster but
  is absent for a standalone `helm lint`/`helm template`, hence `default dict`.
*/}}
{{- $ns := .Values._namespace | default dict }}
{{- $gateway := $ns.gateway | default "" }}
{{- $host := include "n8n.host" . }}
{{- if $gateway }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .Release.Name }}
  labels:
    {{- include "n8n.labels" . | nindent 4 }}
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: cozystack
      namespace: {{ $gateway | quote }}
  hostnames:
    - {{ $host | quote }}
  rules:
    - backendRefs:
        - name: {{ .Release.Name }}
          port: 80
{{- end }}
