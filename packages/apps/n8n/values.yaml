## @param {Resources} [resources] - Explicit CPU/memory overrides. When omitted, `resourcesPreset` is applied.
resources: {}

## @param {ResourcesPreset} resourcesPreset="t1.small" - Default sizing preset for the n8n container.
resourcesPreset: "t1.small"

## @param {string} timezone - Timezone used by n8n for scheduled workflows (IANA name).
timezone: UTC

## @typedef {struct} Image - Container image settings.
## @field {string} repository - Image repository.
## @field {string} tag - Image tag. n8n 2.16.0 or newer is required for the Code Sandbox (sandbox service) integration.

## @param {Image} image - n8n main container image.
image:
  repository: docker.n8n.io/n8nio/n8n
  tag: "2.48.5"

## @param {string} communityPackages - JSON array of npm community packages reconciled by n8n on startup, e.g. `[{"name":"n8n-nodes-searxng","version":"0.2.6"}]`. Requires egress to the npm registry. Leave empty to install nodes from the n8n UI instead.
communityPackages: ""

##
## @section Code Sandbox (n8n sandbox service)
##

## @typedef {struct} SandboxImage - Container image for one sandbox component. All three images share the sandbox service release number.
## @field {string} repository - Image repository.
## @field {string} tag - Image tag.

## @typedef {struct} SandboxApi - The sandbox service API. n8n talks to it over plain HTTP; it owns the store and the runner fleet.
## @field {SandboxImage} image - API image.
## @field {int} replicas - Must stay 1: the default store is SQLite.
## @field {ResourcesPreset} resourcesPreset - Sizing preset for the API container.
## @field {Resources} resources - Explicit CPU/memory overrides for the API container.

## @typedef {struct} SandboxRunner - Runners that execute the generated code. The default `privileged` isolation runs on any node (including immutable-rootfs distributions such as Talos); `sysbox` is opt-in for clusters with a real Sysbox node pool.
## @field {bool} enabled - Deploy the runner StatefulSet and its headless Service.
## @field {string} isolation - `privileged` (portable default; runs on any node, needs a PSA-privileged namespace) or `sysbox` (opt-in; needs Sysbox installed on a dedicated node pool).
## @field {bool} acknowledgePrivileged - Required to render `isolation: privileged`; confirms the namespace admits privileged pods.
## @field {SandboxImage} image - Runner (docker-in-docker) image.
## @field {SandboxImage} sandboxImage - Image each sandbox container runs from.
## @field {int} replicas - Number of runner replicas.
## @field {string} capacityTotal - Maximum concurrent sandboxes per runner. Mandatory; size it for your node pool.
## @field {quantity} dataRootSizeLimit - Size limit of the runner's scratch `emptyDir`.
## @field {object} nodeSelector - Node selector for the runner pods. Empty by default; set `sysbox-install: "yes"` when using `isolation: sysbox`.
## @field {array} tolerations - Tolerations for the runner pods. Empty by default; set the upstream `sysbox-runtime=not-running` toleration when using `isolation: sysbox`.
## @field {ResourcesPreset} resourcesPreset - Sizing preset for each runner replica.
## @field {Resources} resources - Explicit CPU/memory overrides for each runner replica.

## @param {Sandbox} sandbox - Code Sandbox toggle. Disabled by default; enabling deploys the n8n sandbox service API and runners next to n8n and points n8n at it.
sandbox:
  enabled: false

  ## @param {string} apiKey - Admin API key shared with the sandbox API. Empty generates one and preserves it across upgrades. The same value is written to `SANDBOX_API_KEYS` and to n8n's `N8N_SANDBOX_SERVICE_API_KEY`, so the two can never drift.
  apiKey: ""

  ## @param {string} runnerRegistrationToken - Token the runners use to register with the API. Empty generates one and preserves it across upgrades.
  runnerRegistrationToken: ""

  ## @typedef {struct} SandboxExternal - Point n8n at a sandbox service running OUTSIDE this chart, e.g. on a dedicated Cozystack Ubuntu VM (see deploy/sandbox-vm). When enabled, this chart renders no in-cluster sandbox service; it only sets the four n8n env vars.
  ## @field {bool} enabled - Skip the in-cluster sandbox API and runners and use `url` / `apiKey` instead.
  ## @field {string} url - Plain-HTTP URL of the external sandbox API, reachable from the n8n pod (e.g. `http://<vm-address>:8080`).
  ## @field {string} apiKey - Admin API key; must match a value in `SANDBOX_API_KEYS` on the external API.

  ## @param {SandboxExternal} external - Use an externally hosted sandbox service (automatic VM mode). Disabled by default.
  external:
    enabled: false
    url: ""
    apiKey: ""

  ## @param {SandboxApi} api - Sandbox service API.
  api:
    image:
      repository: n8nio/n8n-sandbox-service-api
      tag: "1.16.0"
    replicas: 1
    resourcesPreset: "t1.small"
    resources: {}

  ## @param {SandboxRunner} runner - Sandbox runners. The portable `privileged` default works on any cluster (including Talos); switch to `sysbox` only when a real Sysbox node pool exists.
  runner:
    enabled: true
    isolation: privileged
    acknowledgePrivileged: true
    image:
      repository: n8nio/n8n-sandbox-service-runner-dind
      tag: "1.16.0"
    sandboxImage:
      repository: n8nio/n8n-sandbox-service-sandbox
      tag: "1.16.0"
    replicas: 1
    capacityTotal: "100"
    dataRootSizeLimit: 64Gi
    # Sysbox-only placement. Leave empty for the portable privileged default;
    # set both when switching to `isolation: sysbox` (see README).
    nodeSelector: {}
    tolerations: []
    resourcesPreset: "t1.medium"
    resources: {}

##
## @section Search (SearXNG)
##

## @typedef {struct} Search - Optional in-cluster SearXNG metasearch engine with the JSON API enabled.
## @field {bool} enabled - Deploy SearXNG and expose it to n8n at http://<release>-search:8080.
## @field {Image} image - SearXNG image.
## @field {ResourcesPreset} resourcesPreset - Sizing preset for the SearXNG container.

## @param {Search} search - Search toggle. Disabled by default; enabling deploys a private SearXNG instance.
search:
  enabled: false
  image:
    repository: searxng/searxng
    tag: "2026.11.15-2d500cb6b"
  resourcesPreset: "t1.nano"
  resources: {}
